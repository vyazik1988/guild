<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гильдия искателей приключений</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Russo+One&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: статус гильдии сверху, зал гильдии от лица менеджера за стойкой как главный экран, под ним навигация и заказы в работе; всё остальное открывается окнами Системы. */
:root{
  --night:#07090f; --panel:#0a1428; --panel2:#0f1d3a;
  --sys:#4fb3ff; --sys-dim:#2a6fb0; --sys-glow:rgba(79,179,255,.35);
  --fg:#dce8ff; --muted:#8197bd; --line:#1f3458;
  --gold:#f2c14e; --danger:#ff5d72; --ok:#4fe0a6;
  --r-e:#9aa8bf; --r-d:#5fd28f; --r-c:#4fb3ff; --r-b:#a77bff; --r-a:#ff9a4f; --r-s:#f2c14e;
  --f-ui:"Exo 2","Segoe UI",system-ui,sans-serif;
  --f-disp:"Russo One","Exo 2",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--fg);margin:0}
body{font-family:var(--f-ui);font-size:15px;line-height:1.5;min-height:100%;
  background:radial-gradient(120% 60% at 50% 0%,#1a1630 0%,var(--night) 60%) fixed,var(--night)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sys);outline-offset:2px}

/* HUD */
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;
  border:1px solid var(--sys-dim);background:linear-gradient(180deg,rgba(15,29,58,.9),rgba(10,20,40,.9));
  padding:12px 16px;border-radius:4px;box-shadow:0 0 24px var(--sys-glow),inset 0 0 18px rgba(79,179,255,.08)}
.hud-lvl{display:flex;flex-direction:column;align-items:center;min-width:64px}
.hud-lvl small{font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.hud-lvl b{font-family:var(--f-num);font-size:30px;line-height:1;color:var(--sys);text-shadow:0 0 12px var(--sys-glow)}
.hud-mid{min-width:0;display:flex;flex-direction:column;gap:6px}
.hud-name{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hud-name h1{font-family:var(--f-disp);font-weight:400;font-size:20px;margin:0;letter-spacing:.04em}
.hud-name span{color:var(--muted);font-size:13px}
.xpbar{height:10px;border:1px solid var(--sys-dim);background:#06101f;position:relative;overflow:hidden}
.xpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--sys-dim),var(--sys));box-shadow:0 0 10px var(--sys);transition:width .6s}
.xpmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--f-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hud-rank{width:52px;height:52px;display:grid;place-items:center;border:2px solid currentColor;font-family:var(--f-disp);font-size:26px;transform:rotate(45deg)}
.hud-rank span{transform:rotate(-45deg)}

/* Hall scene */
.hall{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#120c08}
.hall svg{display:block;width:100%;height:auto}
.hot{cursor:pointer}
.hot .hl{opacity:0;transition:opacity .2s}
#hall .hot:hover .olt,#hall .hot:focus-visible .olt{filter:url(#outline)}
#bellLayer{position:absolute;left:35%;bottom:calc(100% * 180 / 680);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.5em;pointer-events:none;z-index:2;font-size:clamp(11px,1.5vw,18px)}
.bub{position:relative;background:#fffaf0;color:#2b2116;border:2px solid #2b2116;border-radius:1em;padding:.35em .9em;font-style:italic;font-weight:700;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:opacity 1s linear;animation:bubIn .18s ease-out}
.bub::after{content:"";position:absolute;left:50%;bottom:-.55em;width:.8em;height:.8em;background:#fffaf0;border-right:2px solid #2b2116;border-bottom:2px solid #2b2116;transform:translateX(-50%) rotate(45deg)}
.bub.fade{opacity:0}
@keyframes bubIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
#hall .bell .olt{transform-box:fill-box;transform-origin:50% 100%}
#hall .bell.ring .olt{animation:ring .5s ease-out}
@keyframes ring{0%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(3deg)}100%{transform:rotate(0)}}
.cam .olt{filter:none!important}
.hot:focus{outline:none}
.hot:hover .stag rect,.hot:focus .stag rect{stroke:#9fd4ff}
.stag text{font-family:var(--f-num);font-size:15px;letter-spacing:.1em;fill:var(--sys)}
.glow{animation:gl 2.6s ease-in-out infinite}
@keyframes gl{50%{opacity:.5}}
.flick{animation:fl 4s ease-in-out infinite}
@keyframes fl{30%{opacity:.85}60%{opacity:1}75%{opacity:.9}}
.hallnav{display:flex;flex-wrap:wrap;gap:8px}
.hud[hidden],.hallnav[hidden],.aqwin[hidden]{display:none!important}
.wrap{box-sizing:border-box;min-height:100vh;min-height:100dvh;justify-content:center;max-width:calc(100vh * 1200 / 680);max-width:calc(100dvh * 1200 / 680);padding:0;gap:0}
.wrap .hall{border:0;border-radius:0}
body:has(.wrap .hall){background:linear-gradient(#1b120b 0 50%,#100a06 50% 100%)}
.hallnav button{flex:1 1 150px}

/* System buttons */
.btn{border:1px solid var(--sys-dim);background:rgba(79,179,255,.08);padding:9px 14px;border-radius:3px;letter-spacing:.03em;transition:background .15s,box-shadow .15s}
.btn:hover{background:rgba(79,179,255,.18);box-shadow:0 0 12px var(--sys-glow)}
.btn.pri{background:var(--sys);color:#04101f;border-color:var(--sys);font-weight:700}
.btn.pri:hover{background:#7cc7ff}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--muted)}
.btn.warn{border-color:var(--danger);color:var(--danger);background:transparent}
.btn.alert{border-color:var(--gold);color:var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}

.win{border:1px solid var(--sys-dim);background:rgba(10,20,40,.94);border-radius:4px;box-shadow:0 0 18px rgba(79,179,255,.12);min-width:0}
.win-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.win-h .tag{font-family:var(--f-num);font-size:11px;letter-spacing:.14em;color:var(--sys);border:1px solid var(--sys-dim);padding:1px 6px;white-space:nowrap}
.win-h h2{font-family:var(--f-disp);font-weight:400;font-size:17px;margin:0;letter-spacing:.04em;flex:1;min-width:0;overflow-wrap:anywhere}
.win-b{padding:14px;display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
h3.sec{margin:0;font-family:var(--f-num);font-size:12px;letter-spacing:.16em;color:var(--sys);font-weight:500;text-transform:uppercase}

.state{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-family:var(--f-num);font-size:12px;padding:2px 8px;border:1px solid currentColor;border-radius:2px;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--danger)} .pill.info{color:var(--sys)} .pill.gold{color:var(--gold)}
textarea,input[type=text],input[type=number],input[type=date],select{width:100%;background:#050d1c;border:1px solid var(--line);border-radius:3px;padding:9px 10px}
textarea{min-height:96px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--sys);outline:none;box-shadow:0 0 0 2px var(--sys-glow)}
label.f,.fl{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.items{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:26px minmax(0,1fr) auto auto auto;gap:6px;align-items:center;border:1px solid var(--line);background:var(--panel2);padding:6px 8px;border-radius:3px;color:var(--fg)}
.item:focus-within{border-color:var(--sys-dim)}
.item .num{font-family:var(--f-num);font-size:12px;color:var(--sys);text-align:center}
.item.isdone .num{color:var(--ok)}
.item input{padding:7px 8px}
.ib{width:30px;height:30px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:3px;line-height:1}
.ib:hover:not(:disabled){border-color:var(--sys-dim);color:var(--fg)}
.ib.rm:hover{border-color:var(--danger);color:var(--danger)}
.ib:disabled{opacity:.3;cursor:default}
.addi{align-self:flex-start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 140px;min-width:0}

/* Quest rows */
.qlist{display:flex;flex-direction:column;gap:8px}
.q{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);background:var(--panel2);border-radius:3px;cursor:pointer;text-align:left;width:100%}
.q:hover{border-color:var(--sys-dim)}
.rk{width:30px;height:30px;display:grid;place-items:center;font-family:var(--f-disp);font-size:15px;border:1.5px solid currentColor;flex:none}
.rk-E{color:var(--r-e)}.rk-D{color:var(--r-d)}.rk-C{color:var(--r-c)}.rk-B{color:var(--r-b)}.rk-A{color:var(--r-a)}.rk-S{color:var(--r-s)}
.q-t{min-width:0}
.q-t b{display:block;font-weight:600;overflow-wrap:anywhere}
.q-t span{font-size:12px;color:var(--muted)}
.mini{display:block;height:4px;background:#06101f;margin-top:5px;position:relative}
.mini i{position:absolute;inset:0 auto 0 0;background:var(--sys)}
.q-r{font-family:var(--f-num);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.over{color:var(--danger)!important}
.empty{border:1px dashed var(--line);padding:16px;text-align:center;color:var(--muted);border-radius:3px}

/* Board modal: two columns */
.board2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.board2{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.paper{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:#e9dfc6;color:#2b2116;border:none;border-radius:2px;padding:10px 12px 10px 14px;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .15s}
.paper:hover{transform:translateY(-2px) rotate(-.4deg)}
.paper::before{content:"";position:absolute;top:-4px;left:50%;width:10px;height:10px;border-radius:50%;background:var(--pin,#c0392b);transform:translateX(-50%);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.paper b{font-weight:700;overflow-wrap:anywhere}
.paper .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:#5b4a33}
.paper .prk{font-family:var(--f-disp);font-size:13px;border:1.5px solid currentColor;padding:0 5px}
.paper .pbar{height:4px;background:#cdbf9f;position:relative}
.paper .pbar i{position:absolute;inset:0 auto 0 0;background:#2a6fb0}
.paper .stamp{position:absolute;right:8px;top:8px;transform:rotate(8deg);border:2px solid #c0392b;color:#c0392b;font-family:var(--f-disp);font-size:11px;padding:1px 5px;letter-spacing:.06em}
.paper .late{color:#b3261e;font-weight:700}

/* Adventurers */
.advs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.adv{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:10px;border:1px solid var(--line);background:var(--panel2);border-radius:3px}
.adv:hover{border-color:var(--sys-dim)}
.adv svg{width:56px;height:56px;display:block}
.adv b{display:block;font-weight:700}
.adv .cls{font-size:12px;color:var(--muted)}
.adv .st{font-size:12px;margin-top:4px}
.adv .lvl{font-family:var(--f-num);font-size:12px;color:var(--sys)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{border:1px solid var(--line);padding:8px 10px;background:var(--panel2)}
.stat small{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--f-num);font-size:18px;font-variant-numeric:tabular-nums}
.stat .bar{height:4px;background:#06101f;margin-top:4px;position:relative}
.stat .bar i{position:absolute;inset:0 auto 0 0;background:var(--sys)}
.advhead{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:center}
.advhead svg{width:88px;height:88px}

.bigbar{height:14px;border:1px solid var(--sys-dim);background:#06101f;position:relative}
.bigbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--sys-dim),var(--sys));box-shadow:0 0 10px var(--sys)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kv div{border:1px solid var(--line);padding:8px 10px;background:var(--panel2)}
.kv small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kv b{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--sys);flex:none}
.check span{overflow-wrap:anywhere}
.check.done span{color:var(--muted);text-decoration:line-through}
.hist{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto;font-size:13px}
.hist div{display:grid;grid-template-columns:auto auto 1fr;gap:10px;color:var(--muted)}
.hist b{color:var(--sys);font-family:var(--f-num)}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.chron{display:flex;flex-direction:column;gap:10px}
.chron article{border-left:2px solid var(--sys-dim);padding:4px 0 4px 12px}
.chron h4{margin:0;font-family:var(--f-num);font-size:13px;color:var(--sys);font-weight:500}
.chron p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
a{color:var(--sys)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--danger);padding:8px 10px;color:var(--danger)}

/* Modal (System window) */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;
  background:rgba(2,5,12,.72);backdrop-filter:blur(3px);
  padding:max(20px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal[hidden]{display:none}
.modal .win{width:min(860px,100%);animation:pop .22s ease-out;margin-top:3vh}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.x{margin-left:auto;background:none;border:1px solid var(--line);width:32px;height:32px;border-radius:3px;color:var(--muted);font-size:18px;line-height:1;flex:none}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.tab{background:none;border:1px solid transparent;padding:6px 10px;border-radius:3px;color:var(--muted)}
.tab[aria-selected=true]{border-color:var(--sys-dim);color:var(--fg);background:rgba(79,179,255,.1)}
.tab em{font-style:normal;font-family:var(--f-num);font-size:11px;margin-left:4px;color:var(--sys)}

.toasts{position:fixed;top:max(14px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100% - 32px));pointer-events:none}
.toast{border:1px solid var(--sys);background:rgba(6,14,30,.96);padding:10px 14px;box-shadow:0 0 20px var(--sys-glow);animation:pop .25s ease-out;font-size:14px}
.toast b{display:block;font-family:var(--f-num);font-size:11px;letter-spacing:.18em;color:var(--sys)}
.toast.lvl{border-color:var(--gold);box-shadow:0 0 26px rgba(242,193,78,.45)}
.toast.lvl b{color:var(--gold)}
.banner{border:1px solid var(--line);padding:10px 14px;color:var(--muted);font-size:13px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.hud{grid-template-columns:auto 1fr}.hud-rank{display:none}.hud-name h1{font-size:17px}.advhead{grid-template-columns:64px 1fr}.advhead svg{width:64px;height:64px}}

/* Camera: board close-up */
.paper{transform:rotate(var(--rot,0deg))}
.paper:hover,.paper:focus-visible{transform:translateY(-3px) rotate(0deg)}
.paper .desc2{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:#4a3b28;line-height:1.4}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.stage{position:fixed;inset:0;z-index:40;overflow:hidden}
.stage-dim{position:absolute;inset:0;background:#05070d}
.stage .cam{position:absolute;inset:0;width:100%;height:100%;display:block}
.bpanel{position:absolute;top:max(12px,env(safe-area-inset-top,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto;display:flex;flex-direction:column;
  border:12px solid #5a3f22;outline:2px solid #2c1d10;border-radius:3px;box-shadow:0 24px 70px rgba(0,0,0,.65),inset 0 0 40px rgba(0,0,0,.35);
  background-color:#6b4b2a;background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.05) 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,rgba(0,0,0,.14) 0 2px,transparent 3px);background-size:22px 22px,17px 17px}
.bp-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#4a311c;border-bottom:3px solid #2c1d10}
.bp-h h2{flex:1;margin:0;text-align:center;font-family:var(--f-disp);font-weight:400;font-size:18px;letter-spacing:.12em;color:#f3e6cf;min-width:0}
.btn.wood{border-color:#c9a24a;color:#f3e6cf;background:rgba(0,0,0,.25)}
.btn.wood:hover{background:rgba(201,162,74,.2);box-shadow:none}
.bp-b{flex:1;min-height:0;overflow-y:auto;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.bp-col{min-width:0}
.bp-col+.bp-col{border-left:3px dashed #3d2816;padding-left:20px}
.bp-col h3{margin:0 0 16px;text-align:center;font-family:var(--f-disp);font-weight:400;font-size:15px;letter-spacing:.14em;color:#f3e6cf}
.bp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px 16px}
.bp-grid .paper{min-height:150px;padding:14px 14px 12px}
.bp-empty{grid-column:1/-1;margin:24px 0;text-align:center;color:#d8c39b}
@media (max-width:640px){.bp-b{grid-template-columns:1fr;padding:14px}.bp-col+.bp-col{border-left:none;padding-left:0;border-top:3px dashed #3d2816;padding-top:16px}}
/* Paper sheet up close */
.sheetwrap{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheetback{position:absolute;inset:0;background:rgba(5,7,13,.62)}
.sheet{position:relative;width:min(680px,100%);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;
  padding:30px 26px 22px;border-radius:2px;background:#efe4c8 linear-gradient(180deg,#f3ead2,#e9dcbc);box-shadow:0 30px 80px rgba(0,0,0,.6);font-size:15px;
  --fg:#2b2116;--muted:#6b5a40;--line:#cdbb93;--panel2:#f6eedb;--sys:#1f5f9e;--sys-dim:#1f5f9e;--sys-glow:rgba(31,95,158,.22);--danger:#b3261e;--ok:#2f7a4f;--gold:#8a6410;
  --r-e:#5d6b80;--r-d:#2f7a4f;--r-c:#1f5f9e;--r-b:#6c45c9;--r-a:#b5541a;--r-s:#8a6410;color:var(--fg)}
.sheet.flying{overflow:hidden}
.sheet::before{content:"";position:absolute;top:10px;left:50%;width:14px;height:14px;border-radius:50%;background:#c0392b;transform:translateX(-50%);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.sh-h{display:flex;align-items:center;gap:12px}

<script>
/* ---------- Supabase backend: login + the small db/user/assets API the game expects ---------- */
(function(){
const SUPA_URL="https://zxlelnjnguorqoqnqzgw.supabase.co";
const SUPA_KEY="sb_publishable_OGsWYqEtfhXHnZTs2OPOYg_kQqUNo1E";
const BUCKET="files";
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
window.blobUrl=id=>sb.storage.from(BUCKET).getPublicUrl(id).data.publicUrl;

const err=(e)=>{if(!e)return e;const x=new Error(e.message||String(e));x.code=(e.code==="42501"||/row-level security|permission denied/i.test(e.message||""))?"invalid_argument":(e.code||"unavailable");return x};
const ok=r=>{if(r.error)throw err(r.error);return r.data};

/* ---------- login screen ---------- */
const css=document.createElement("style");
css.textContent=`
#auth{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 30%,#2a1b10,#0c0805 70%);font-family:"Exo 2",system-ui,sans-serif}
#auth[hidden],#auth label[hidden],#auth .sw[hidden]{display:none}
#auth .card{width:min(380px,100%);background:#efe4c8;color:#2b2116;border-radius:6px;padding:26px 24px 22px;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 0 0 1px #c9b78f}
#auth h1{margin:0 0 4px;font-family:"Russo One",sans-serif;font-weight:400;font-size:22px;letter-spacing:.02em}
#auth p{margin:0 0 16px;font-size:14px;color:#6b5a40;line-height:1.4}
#auth label{display:block;font-size:13px;color:#6b5a40;margin:0 0 10px}
#auth input{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:9px 10px;border:1px solid #cdbb93;border-radius:4px;background:#fffaf0;color:#2b2116;font:inherit;font-size:15px;color-scheme:light}
#auth input:focus{outline:2px solid #1f5f9e;outline-offset:0;border-color:#1f5f9e}
#auth .go{width:100%;margin-top:6px;padding:10px;border:0;border-radius:4px;background:#1f5f9e;color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
#auth .go:disabled{opacity:.6;cursor:default}
#auth .sw{display:block;margin:14px auto 0;background:none;border:0;color:#1f5f9e;font:inherit;font-size:14px;text-decoration:underline;cursor:pointer}
#auth .msg{min-height:1.2em;margin:10px 0 0;font-size:13px;color:#b3261e;line-height:1.4}
#auth .msg.ok{color:#2f7a4f}
#logout{position:fixed;right:10px;bottom:10px;z-index:50;padding:5px 10px;border:1px solid rgba(230,200,138,.35);border-radius:4px;background:rgba(12,8,5,.55);color:#cdb98f;font:13px "Exo 2",system-ui,sans-serif;cursor:pointer;opacity:.55}
#logout:hover,#logout:focus-visible{opacity:1}`;
document.head.appendChild(css);
const box=document.createElement("div");box.id="auth";box.hidden=true;
box.innerHTML='<form class="card" novalidate><h1>Гильдия искателей приключений</h1><p id="au-sub">Войди, чтобы открыть зал гильдии.</p>'+
  '<label id="au-nw" hidden>Имя<input id="au-name" autocomplete="name" maxlength="40" placeholder="Как тебя называть"></label>'+
  '<label>Почта<input id="au-email" type="email" autocomplete="email" required></label>'+
  '<label>Пароль<input id="au-pass" type="password" autocomplete="current-password" minlength="6" required></label>'+
  '<button class="go" id="au-go" type="submit">Войти</button><div class="msg" id="au-msg" role="status"></div>'+
  '<button class="sw" id="au-sw" type="button">Нет аккаунта? Зарегистрироваться</button></form>';
document.body.appendChild(box);
const q=s=>box.querySelector(s);let mode="in";
const say=(t,good)=>{q("#au-msg").textContent=t||"";q("#au-msg").className="msg"+(good?" ok":"")};
const setMode=m=>{mode=m;q("#au-nw").hidden=m!=="up";q("#au-go").textContent=m==="up"?"Зарегистрироваться":"Войти";
  q("#au-sw").textContent=m==="up"?"Уже есть аккаунт? Войти":"Нет аккаунта? Зарегистрироваться";q("#au-pass").autocomplete=m==="up"?"new-password":"current-password";say("")};
q("#au-sw").onclick=()=>setMode(mode==="in"?"up":"in");

let member=null,sessUser=null,resolveReady;
const ready=new Promise(r=>resolveReady=r);

async function enter(user){
  sessUser=user;
  const r=await sb.rpc("join_guild",{display_name:(user.user_metadata&&user.user_metadata.name)||null});
  if(r.error){say("Не удалось связаться с базой гильдии: "+r.error.message);box.hidden=false;return false}
  if(!r.data){box.hidden=false;say("Почты "+user.email+" нет в списке гильдии. Попроси владельца добавить её.");
    q("#au-go").textContent="Выйти";mode="out";q("#au-sw").hidden=true;return false}
  member=r.data;box.hidden=true;
  const lo=document.createElement("button");lo.id="logout";lo.type="button";lo.textContent="Выйти";
  lo.onclick=async()=>{await sb.auth.signOut();location.reload()};document.body.appendChild(lo);
  resolveReady();return true;
}
q("form").onsubmit=async e=>{
  e.preventDefault();
  if(mode==="out"){await sb.auth.signOut();location.reload();return}
  const email=q("#au-email").value.trim(),password=q("#au-pass").value,name=q("#au-name").value.trim();
  if(!email||!password){say("Введи почту и пароль.");return}
  if(password.length<6){say("Пароль должен быть не короче 6 символов.");return}
  if(mode==="up"&&!name){say("Напиши, как тебя называть.");return}
  q("#au-go").disabled=true;say("");
  try{
    if(mode==="up"){
      const r=await sb.auth.signUp({email,password,options:{data:{name}}});
      if(r.error){say(/registered|already/i.test(r.error.message)?"Такая почта уже зарегистрирована. Войди.":r.error.message);return}
      if(!r.data.session){say("Аккаунт создан, но Supabase ждёт подтверждения почты. Владельцу нужно выключить «Confirm email» в настройках входа.");return}
      await enter(r.data.session.user);
    }else{
      const r=await sb.auth.signInWithPassword({email,password});
      if(r.error){say(/invalid/i.test(r.error.message)?"Неверная почта или пароль.":/confirm/i.test(r.error.message)?"Почта не подтверждена. Владельцу нужно выключить «Confirm email» в настройках входа.":r.error.message);return}
      await enter(r.data.user);
    }
  }catch(x){say("Нет связи с сервером. Проверь интернет и попробуй ещё раз.")}
  finally{q("#au-go").disabled=false}
};
sb.auth.getSession().then(r=>{const s=r.data&&r.data.session;if(s)enter(s.user);else{box.hidden=false;q("#au-email").focus()}})
  .catch(()=>{box.hidden=false;say("Нет связи с сервером.")});

/* ---------- db: collections and documents with live updates ---------- */
const colSubs={},docSubs={};let chan=null,timers={};
const snapDoc=(id,data)=>({id,exists:data!=null,data:()=>data});
async function fetchCol(c){const rows=ok(await sb.from("docs").select("id,data").eq("col",c));return rows||[]}
async function refresh(c){
  if(!colSubs[c]&&!Object.keys(docSubs).some(k=>k.startsWith(c+"/")))return;
  let rows;try{rows=await fetchCol(c)}catch(e){(colSubs[c]||[]).forEach(s=>s.onErr&&s.onErr(e));return}
  (colSubs[c]||[]).forEach(s=>{let list=rows.slice();
    if(s.order){const[f,dir]=s.order;list.sort((a,b)=>{const x=(a.data||{})[f]??"",y=(b.data||{})[f]??"";return (x<y?-1:x>y?1:0)*(dir==="desc"?-1:1)})}
    if(s.lim)list=list.slice(0,s.lim);
    s.cb({docs:list.map(r=>snapDoc(r.id,r.data)),size:list.length})});
  Object.keys(docSubs).forEach(k=>{const[cc,id]=k.split("/");if(cc!==c)return;const r=rows.find(x=>x.id===id);docSubs[k].forEach(s=>s.cb(snapDoc(id,r?r.data:null)))});
}
const soon=c=>{clearTimeout(timers[c]);timers[c]=setTimeout(()=>refresh(c),120)};
function live(){if(chan)return;chan=sb.channel("guild-docs").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{const c=(p.new&&p.new.col)||(p.old&&p.old.col);if(c)soon(c);else Object.keys(colSubs).forEach(soon)}).subscribe()}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)Object.keys(colSubs).forEach(soon)});
function collection(c){
  const s={order:null,lim:0};
  const api={orderBy(f,dir){s.order=[f,dir||"asc"];return api},limit(n){s.lim=n;return api},
    onSnapshot(cb,onErr){s.cb=cb;s.onErr=onErr;(colSubs[c]=colSubs[c]||[]).push(s);live();refresh(c);
      return()=>{colSubs[c]=colSubs[c].filter(x=>x!==s)}}};
  return api;
}
function doc(path){
  const i=path.indexOf("/"),c=path.slice(0,i),id=path.slice(i+1);
  return{
    async set(data){ok(await sb.from("docs").upsert({col:c,id,data,updated_at:new Date().toISOString()}));refresh(c)},
    async update(patch){ok(await sb.rpc("doc_merge",{c,i:id,patch}));refresh(c)},
    async delete(){ok(await sb.from("docs").delete().eq("col",c).eq("id",id));refresh(c)},
    async get(){const r=ok(await sb.from("docs").select("data").eq("col",c).eq("id",id).maybeSingle());return snapDoc(id,r?r.data:null)},
    onSnapshot(cb,onErr){const k=c+"/"+id,s={cb,onErr};(docSubs[k]=docSubs[k]||[]).push(s);live();
      sb.from("docs").select("data").eq("col",c).eq("id",id).maybeSingle().then(r=>{if(r.error){onErr&&onErr(err(r.error));return}cb(snapDoc(id,r.data?r.data.data:null))});
      return()=>{docSubs[k]=docSubs[k].filter(x=>x!==s)}}
  };
}
const dbApi={collection,doc};

/* ---------- user ---------- */
const userApi={
  async me(){return{id:sessUser.id,name:(member&&member.name)||(sessUser.email||"").split("@")[0],isOwner:!!(member&&member.role==="owner")}},
  async can(){return !!member},
  async profiles(ids){const out={};try{const rows=ok(await sb.from("members").select("user_id,name,email").in("user_id",ids.filter(x=>/^[0-9a-f-]{36}$/i.test(x))));
    (rows||[]).forEach(r=>{out[r.user_id]={name:r.name||(r.email||"").split("@")[0]}})}catch(e){}return out}
};

/* ---------- files ---------- */
const assetsApi={
  async upload(file,opt){const ext=(file.name.match(/\.[a-z0-9]{1,8}$/i)||[""])[0].toLowerCase();
    const path=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))+ext;
    ok(await sb.storage.from(BUCKET).upload(path,file,{contentType:(opt&&opt.type)||file.type||"application/octet-stream",upsert:false}));
    return{id:path,sizeBytes:file.size,contentType:(opt&&opt.type)||file.type}},
  async delete(id){ok(await sb.storage.from(BUCKET).remove([id]))}
};

window.claude={use:async name=>{await ready;return name==="db"?dbApi:name==="user"?userApi:name==="assets"?assetsApi:null}};
})();
</script>
<script>
(function(){
const RANKS=["E","D","C","B","A","S"];
const RANK_XP={E:10,D:25,C:50,B:100,A:200,S:400};
const RANK_HINT={E:"пара часов",D:"день",C:"несколько дней",B:"неделя",A:"2-3 недели",S:"месяц и больше"};
const STATUS={board:"Новый",active:"В работе",review:"На проверке",done:"Выполнен"};
const KIND={simple:"Обычный",counter:"Счётчик",checklist:"Чек-лист"};
const CLASSES={
  chron:{n:"Летописец",area:"Изучение и прочтение книг и статей",c:"#a77bff"},
  eng:{n:"Инженер",area:"Разработка прототипов, кодинг",c:"#ff9a4f"},
  sci:{n:"Учёный",area:"Исследования",c:"#5fd28f"}
};
const NO_CLASS={n:"Авантюрист",area:"",c:"#9aa8bf"};
const MAX_ACTIVE=1, MAX_ADVS=3, DAILY_XP=15, STEP_XP=2;
let draft=[],assetsApi=null,uploading={},pendingFiles=[];
const ATT_TYPES={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",svg:"image/svg+xml",mp4:"video/mp4",webm:"video/webm",txt:"text/plain",md:"text/markdown",csv:"text/csv",json:"application/json"};
const ATT_ACCEPT=Object.keys(ATT_TYPES).map(e=>"."+e).join(",");
const ATT_HINT="PDF, изображения, видео, TXT, MD, CSV, JSON · до 20 МБ";
const fmtSize=b=>b<1024?b+" Б":b<1048576?Math.round(b/1024)+" КБ":(b/1048576).toFixed(1)+" МБ";
const extOf=n=>(String(n).split(".").pop()||"").toLowerCase();
const GUILD_TITLE={E:"Захудалая контора",D:"Местная гильдия",C:"Надёжная гильдия",B:"Известная гильдия",A:"Прославленная гильдия",S:"Королевская гильдия"};

let db=null,user=null,me=null,isOwner=false,canWrite=true;
let quests=[],daily=[],advs=[],ownerId=null;
let loaded=false,prevLevel=null,modalState=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return ymd(d)};
const ru=s=>{if(!s)return"";const[y,m,d]=s.split("-");return d+"."+m+"."+y};
const ruShort=s=>{if(!s)return"";const[y,m,d]=s.split("-");return d+"."+m};
const wd=s=>["вс","пн","вт","ср","чт","пт","сб"][new Date(s+"T12:00:00").getDay()];
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);

function toast(text,kind){
  const t=document.createElement("div");t.className="toast"+(kind==="lvl"?" lvl":"");
  t.innerHTML="<b>"+(kind==="lvl"?"LEVEL UP":"СИСТЕМА")+"</b>"+esc(text);
  $("#toasts").appendChild(t);setTimeout(()=>t.remove(),kind==="lvl"?5200:3200);
}

/* ---------- derived numbers ---------- */
const advById=id=>advs.find(a=>a.id===id);
const RAT_C="#9a9384",RAT_CLASS={n:"Нора",area:"Задания, до которых никому нет дела",c:RAT_C};
const advColor=a=>a?(a.cls==="rat"?RAT_C:CLASSES[a.cls]?.c||a.color||"#9aa8bf"):"#9aa8bf";
const advCls=a=>a?.cls==="rat"?RAT_CLASS:CLASSES[a?.cls]||NO_CLASS;
/* quests given to the rats: q.adv==="rat", q.rat = the rat's name */
const RAT_NAMES=["Ахиллес","Аякс","Арес","Аризона","Эш","Аспен","Огги","Большой Сэл","Кусачий Майк","Блейн","Бобби","Бобби Детройт","Бун","Брюс Дважды","Калхун","Каллиопа","Карл","Карл Второй","Карлито","Кэш","Кэти-через-К","Шарлотта","Нахалка","Честер","Пухляш","Чак","Зира","Кекс","Дейн","Данте","Дакс","Дениза","Диллон","Донна","Донован","Голландец","Эдди","Илай","Эрика","Толстомордый","Фрэнки","Фредди","Джин","Джордж","Гомес","Мармеладка","Гектор","Хелен","Гера","Ингрид","Джеки","Жак","Джейк","Хименес","Джейн","Жасмин","Джаспер","Джесси","Джимми","Джимми Ти","Младший","Кэти-через-Кэ","Келли","Кингстон","Безделушка","Кулас","Леви","Лексингтон","Лилия","Малыш Сэл","Лив","Лу","Луи","Луиза","Манго","Маркус","Марго","Мэтт","Мигель","Милдред","Мокко","Монти","Начо","Ник","Мускат","Оди","Орегано","Паломо","Пол","Арахис","Фиби","Филипп","Горошек","Картошка","Просекко","Тыковка","Бешеный Ронни","Радуга","Реджано","Реджинальд","Рино","Родриго","Рокко","Сэм","Санчес","Сара","Курносая Молли","Газировка","Колючий Майк","Стюарт","Мак-Выкидуха","Ти-Джей","Томазо","Грег Два Башмака","Валери","Винс","Вино","Уолли","Винтик","Зеро"];
const isRat=q=>!!q&&q.adv==="rat";
const advLabel=a=>a.cls==="rat"?a.name:a.name+" · "+advCls(a).n;
const qAdv=q=>isRat(q)?{id:"rat",cls:"rat",name:"Крыса "+(q.rat||"без имени"),color:RAT_C}:advById(q&&q.adv);
function pickRatName(q){
  if(q&&q.rat)return q.rat;
  const busy=new Set(quests.filter(x=>isRat(x)&&x.status==="active").map(x=>x.rat));
  const free=RAT_NAMES.filter(n=>!busy.has(n)),pool=free.length?free:RAT_NAMES;
  return pool[Math.floor(Math.random()*pool.length)];
}
function progressOf(q){
  if(q.kind==="counter"){const t=+q.target||0;return t?Math.min(1,(+q.current||0)/t):0}
  if(q.kind==="checklist"){const it=q.items||[];return it.length?it.filter(i=>i.d).length/it.length:0}
  return q.status==="done"?1:0;
}
const questXP=q=>q.status!=="done"?0:(RANK_XP[q.rank]||10)+(q.kind==="checklist"?Math.min(200,(q.history||[]).filter(h=>h.delta==="✓").length)*STEP_XP:0);
function guildXP(){return quests.reduce((s,q)=>s+questXP(q),0)+reports().length*DAILY_XP}
function levelFrom(xp,base,step){let l=1,need=base,acc=0;while(xp>=acc+need){acc+=need;l++;need=base+(l-1)*step}return{level:l,into:xp-acc,need}}
const guildLevel=xp=>levelFrom(xp,100,25);
const ADV_RANKS=[["E",0],["D",100],["C",450],["B",1250],["A",2700],["S",5000]];
function advRankInfo(xp){let i=0;while(i+1<ADV_RANKS.length&&xp>=ADV_RANKS[i+1][1])i++;const cur=ADV_RANKS[i],nx=ADV_RANKS[i+1];

/* ---------- Hall scene ---------- */
function wrapT(t,n,max){
  const w=String(t||"").split(/\s+/).filter(Boolean),out=[];let cur="",used=0;
  for(const x of w){const nx=cur?cur+" "+x:x;
    if(nx.length<=n){cur=nx;used++;continue}
    if(cur)out.push(cur);if(out.length===max){cur="";break}
    cur=x.length>n?x.slice(0,n-1)+"…":x;used++}
  if(cur&&out.length<max)out.push(cur);
  if(used<w.length&&out.length){const l=out[out.length-1];out[out.length-1]=(l.length>n-1?l.slice(0,n-1):l).replace(/…$/,"")+"…"}
  return out.slice(0,max);
}

/* ---------- camera: zoom on the drawn board, paper sheet up close ---------- */
let stage=null,sheet=null;
const RM=()=>{try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}};
const D=ms=>RM()?1:ms;
const EASE="cubic-bezier(.55,0,.2,1)";
const REG={full:{x:596,y:10,w:488,h:334},board:{x:600,y:10,w:248,h:334},work:{x:832,y:10,w:248,h:334}};
const narrow=()=>innerWidth<720&&innerWidth/innerHeight<1.05;
function camTarget(cam,reg){
  const R=$("#hall").getBoundingClientRect();
  const bottom=narrow()?68:14,P={left:12,top:62,width:innerWidth-24,height:innerHeight-62-bottom};
  const u=R.width/1200,k=Math.min(P.width/(reg.w*u),P.height/(reg.h*u));
  return{R,k,tx:P.left+P.width/2-R.left-k*(reg.x+reg.w/2)*u,ty:P.top+P.height/2-R.top-k*(reg.y+reg.h/2)*u};
}
const camHome=()=>({R:$("#hall").getBoundingClientRect(),k:1,tx:0,ty:0});
/* The camera moves the SVG viewBox, so the browser redraws vectors at every zoom level (sharp text). */
function camView(cam,c){
  const sc=c.k*c.R.width/1200,ox=c.R.left+c.tx,oy=c.R.top+c.ty;
  cam.setAttribute("viewBox",(-ox/sc)+" "+(-oy/sc)+" "+(innerWidth/sc)+" "+(innerHeight/sc));
}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function animCam(cam,from,to,dur){
  if(stage&&stage._raf)cancelAnimationFrame(stage._raf);
  return new Promise(res=>{
    const t0=performance.now(),st=stage;
    const step=now=>{
      const t=Math.min(1,(now-t0)/dur),e=ease(t),L=(a,b)=>a+(b-a)*e;
      camView(cam,{R:to.R,k:L(from.k,to.k),tx:L(from.tx,to.tx),ty:L(from.ty,to.ty)});
      if(t<1&&st)st._raf=requestAnimationFrame(step);else{if(st)st._raf=0;res()}
    };
    if(dur<=1){camView(cam,to);res()}else step(t0);
  });
}
function fillCam(){
  if(!stage)return;const cam=stage.querySelector(".cam");
  cam.innerHTML='<defs><clipPath id="camclip"><rect width="1200" height="680"/></clipPath></defs><g clip-path="url(#camclip)">'+$("#hall").innerHTML+'</g>';
  cam.querySelectorAll("[tabindex]").forEach(e=>{e.setAttribute("tabindex","-1");e.removeAttribute("role");e.removeAttribute("aria-label")});
  cam.querySelectorAll("[data-paper]").forEach(g=>{
    g.setAttribute("tabindex","0");g.setAttribute("role","button");
    g.onclick=e=>{e.stopPropagation();openSheet(g.dataset.paper,g)};
    g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openSheet(g.dataset.paper,g)}};
    if(sheet&&sheet._id===g.dataset.paper)g.style.visibility="hidden";
  });
  const np=cam.querySelector("[data-newpaper]");
  if(np){np.setAttribute("tabindex","0");np.setAttribute("role","button");
    np.onclick=e=>{e.stopPropagation();openSheet(null,np,"new")};
    np.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openSheet(null,np,"new")}};
    if(sheet&&sheet._mode==="new"&&!sheet._id)np.style.visibility="hidden"}
  cam.querySelectorAll("[data-more]").forEach(t=>t.onclick=()=>openModal("list",t.dataset.more));
}
function openNewSheet(){openSheet(null,document.querySelector(".stage .cam [data-newpaper]"),"new")}
function renderStageCtl(){
  if(!stage)return;const ctl=stage.querySelector(".stage-ctl"),n=narrow();
  ctl.innerHTML='<div class="sc-top"><button class="btn wood" data-bp-back>← В зал</button></div>'+
    (n?'<div class="sc-bot"><button class="btn wood" data-reg="board" aria-pressed="'+(stage._reg!=="work")+'">Новые</button><button class="btn wood" data-reg="work" aria-pressed="'+(stage._reg==="work")+'">В работе</button></div>':"");
  ctl.querySelector("[data-bp-back]").onclick=closeBoard;
  ctl.querySelectorAll("[data-reg]").forEach(b=>b.onclick=()=>panTo(b.dataset.reg));
}
function panTo(reg){
  if(!stage||stage._closing||stage._reg===reg)return;
  const cam=stage.querySelector(".cam"),from=stage._c,to=camTarget(cam,REG[reg]);
  stage._reg=reg;stage._c=to;
  animCam(cam,from,to,D(280));
  renderStageCtl();
}
function openBoard(after){
  if(stage){if(after)after();return}closeModal();
  stage=document.createElement("div");stage.className="stage";stage._kind="board";
  stage.innerHTML='<div class="stage-dim"></div><svg class="cam" preserveAspectRatio="none" role="group" aria-label="Доска заказов вблизи"></svg><div class="stage-ctl"></div>';
  document.body.appendChild(stage);document.documentElement.style.overflow="hidden";
  const s=stage,cam=s.querySelector(".cam");
  s._reg=narrow()?"board":"full";
  fillCam();renderStageCtl();
  const home=camHome(),c=camTarget(cam,REG[s._reg]);s._c=c;
  camView(cam,home);
  s.querySelector(".stage-dim").animate([{opacity:0},{opacity:1}],{duration:D(280),fill:"forwards"});
  setTimeout(()=>cam.classList.add("detail"),D(100));
  animCam(cam,home,c,D(320))
    .then(()=>{if(stage!==s)return;const ctl=s.querySelector(".stage-ctl");ctl.classList.add("on");if(after){after();return}const b=ctl.querySelector("[data-bp-back]");b&&b.focus()}).catch(()=>{});
  let sx=null;
  s.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
  s.addEventListener("touchend",e=>{if(sx==null||!narrow()||sheet)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)panTo(dx<0?"work":"board")},{passive:true});
}
function closeBoard(){
  if(stage&&stage._kind!=="board"){closeScene();return}
  if(!stage||stage._closing)return;
  if(sheet)closeSheet(true);
  const s=stage;s._closing=true;
  const cam=s.querySelector(".cam");
  s.querySelector(".stage-ctl").classList.remove("on");
  setTimeout(()=>cam.classList.remove("detail"),D(100));
  s.querySelector(".stage-dim").animate([{opacity:1},{opacity:0}],{duration:D(300),fill:"forwards"});
  animCam(cam,s._c,camHome(),D(300))
    .catch(()=>{}).finally(()=>{s.remove();if(stage===s)stage=null;document.documentElement.style.overflow="";
      const h=document.querySelector('#hall [data-open="board"]');if(h)try{h.focus({preventScroll:true})}catch(e){}});
}
function renderBoardPanel(){if(stage&&stage._kind==="board"&&!stage._closing){fillCam();renderStageCtl()}}
addEventListener("resize",()=>{
  if(!stage||stage._closing||stage._kind!=="board")return;
  if(narrow()&&stage._reg==="full")stage._reg="board";
  if(!narrow()&&stage._reg!=="full")stage._reg="full";
  const cam=stage.querySelector(".cam"),c=camTarget(cam,REG[stage._reg]);stage._c=c;
  camView(cam,c);renderStageCtl();
});

const SREG={nora:{x:10,y:356,w:136,h:84},table:{x:130,y:288,w:340,h:184},journal:{x:466,y:468,w:268,h:112},status:{x:132,y:566,w:166,h:108},archive:{x:752,y:566,w:166,h:108}};
const SOBJ={nora:{x:22,y:372,w:40,h:60},table:{x:160,y:366,w:280,h:44},journal:{x:520,y:514,w:160,h:34},status:{x:170,y:576,w:64,h:88},archive:{x:790,y:576,w:64,h:88}};
const SNAME={nora:"Нора",table:"Стол авантюристов",journal:"Журнал смены",status:"Книга «Статус гильдии»",archive:"Книга «Архив»"};
const GUILD_OPEN="2026-10-26",GUILD_CLOSE="2027-02-12";
const WD_FULL=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
const shiftDay=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return ymd(d)};
const isNarrowBook=()=>innerWidth<720;
const pageWrap=h=>'<div class="pgin">'+h+'</div>';
const kvRows=arr=>arr.map(([k,v])=>'<tr><td>'+k+'</td><td class="num">'+esc(String(v))+'</td></tr>').join("");
const rosterSorted=()=>advs.slice().sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||"")||a.id.localeCompare(b.id));
function scrRect(c,o){const sc=c.k*c.R.width/1200,ox=c.R.left+c.tx,oy=c.R.top+c.ty;return{left:ox+o.x*sc,top:oy+o.y*sc,width:o.w*sc,height:o.h*sc}}
function fillCamPlain(cam){
  cam.innerHTML='<defs><clipPath id="camclip"><rect width="1200" height="680"/></clipPath></defs><g clip-path="url(#camclip)">'+$("#hall").innerHTML+'</g>';
  cam.querySelectorAll("[tabindex]").forEach(e=>{e.setAttribute("tabindex","-1");e.removeAttribute("role");e.removeAttribute("aria-label")});
}
function renderSceneCtl(){
  if(!stage)return;const ctl=stage.querySelector(".stage-ctl");
  ctl.innerHTML='<div class="sc-top"><button class="btn wood" data-bp-back>← В зал</button></div>';
  ctl.querySelector("[data-bp-back]").onclick=closeScene;
}
const BOOKK=k=>k==="status"||k==="archive";
function camFromRect(o,C){const R=$("#hall").getBoundingClientRect(),sc=C.width/o.w;return{R,k:sc*1200/R.width,tx:C.left-o.x*sc-R.left,ty:C.top-o.y*sc-R.top}}
function openScene(kind,after){
  if(stage){if(stage._kind===kind&&!stage._closing&&after)after();return}
  closeModal();
  const s=stage=document.createElement("div");s.className="stage";s._kind=kind;
  s.innerHTML='<div class="stage-dim"></div><svg class="cam" preserveAspectRatio="none" aria-hidden="true"></svg><div class="veil"></div><div class="ovl" role="dialog" aria-modal="true" aria-label="'+SNAME[kind]+'"></div><div class="stage-ctl"></div>';
  document.body.appendChild(s);document.documentElement.style.overflow="hidden";
  const cam=s.querySelector(".cam");fillCamPlain(cam);
  const home=camHome();camView(cam,home);
  let c;
  if(BOOKK(kind)){
    buildBook(s);const bk=s.querySelector(".book");bk.style.visibility="hidden";
    const Rf=bk.querySelector(".cover").getBoundingClientRect();s._shift=bk.classList.contains("single")?0:Rf.width/2;
    c=camFromRect(SOBJ[kind],{left:Rf.left-s._shift,top:Rf.top,width:Rf.width,height:Rf.height});
  }else c=camTarget(cam,SREG[kind]);
  s._c=c;
  s.querySelector(".stage-dim").animate([{opacity:0},{opacity:1}],{duration:D(300),fill:"forwards"});
  renderSceneCtl();
  animCam(cam,home,c,D(BOOKK(kind)?260:300)).then(()=>stage===s?sceneIn(s):null)
    .then(()=>{if(stage!==s)return;s.querySelector(".stage-ctl").classList.add("on");if(after)after();else{const b=s.querySelector(".ovl button,.ovl textarea,[data-bp-back]");b&&b.focus({preventScroll:true})}}).catch(()=>{});
}
function openBookAnim(s,book,closedT,openT){
  const cover=book.querySelector(".cover"),n=book.classList.contains("single");
  book.classList.remove("shut");
  const ease="cubic-bezier(.45,0,.2,1)",slide=book.animate([{transform:closedT},{transform:openT}],{duration:D(300),easing:ease,fill:"forwards"});
  const flip=n?cover.animate([{transform:"rotateY(0deg)",opacity:1},{transform:"rotateY(-115deg)",opacity:0}],{duration:D(300),easing:ease,fill:"forwards"}).finished
    :flipEl(cover,0,-180,cover.querySelector(".cfront"),cover.querySelector(".cback"),D(300));
  return Promise.all([slide.finished,flip]).then(()=>{if(stage!==s)return;book.classList.remove("closed");cover.style.display="none"});
}
function closeBookAnim(s,book,closedT,openT){
  const cover=book.querySelector(".cover"),n=book.classList.contains("single"),cb=cover.querySelector(".cback"),cf=cover.querySelector(".cfront");
  if(!n)cb.innerHTML=book.querySelector(".pl").innerHTML;
  book.getAnimations().forEach(a=>a.cancel());cover.getAnimations().forEach(a=>a.cancel());
  book.style.transform="";book.classList.add("closed");cover.style.display="";
  const ease="cubic-bezier(.45,0,.2,1)",slide=book.animate([{transform:openT},{transform:closedT}],{duration:D(260),easing:ease,fill:"forwards"});
  let flip;
  if(n)flip=cover.animate([{transform:"rotateY(-115deg)",opacity:0},{transform:"rotateY(0deg)",opacity:1}],{duration:D(260),easing:ease,fill:"forwards"}).finished;
  else{cb.style.visibility="visible";cf.style.visibility="hidden";flip=flipEl(cover,-180,0,cb,cf,D(260))}
  return Promise.all([slide.finished,flip]).then(()=>book.classList.add("shut"));
}
function bindNoraCam(s){
  const n=s.querySelector(".cam [data-noranote]");if(!n)return;
  n.setAttribute("tabindex","0");n.setAttribute("role","button");n.style.cursor="pointer";
  n.onclick=e=>{e.stopPropagation();openSheet(null,n,"view","nora")};
  n.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openSheet(null,n,"view","nora")}};
}
function sceneIn(s){
  const kind=s._kind,ov=s.querySelector(".ovl"),veil=s.querySelector(".veil");
  if(kind==="nora"){ov.removeAttribute("role");ov.removeAttribute("aria-modal");bindNoraCam(s);return Promise.resolve()}
  if(BOOKK(kind)){
    const book=ov.querySelector(".book"),closedT="translate("+(-s._shift)+"px,0px)";
    book.style.transform=closedT;book.style.visibility="";hideInCam(s,true);
    veil.animate([{opacity:0},{opacity:.8}],{duration:D(500),fill:"forwards"});
    return openBookAnim(s,book,closedT,"translate(0px,0px)").then(()=>{if(stage===s){book.getAnimations().forEach(a=>a.cancel());book.style.transform=""}});
  }
  const T=scrRect(s._c,SOBJ[kind]);s._T=T;
  veil.animate([{opacity:0},{opacity:.8}],{duration:D(380),fill:"forwards"});
  if(kind==="table"){
    ov.innerHTML='<div class="ttop"></div>';const el=ov.firstChild;sizeTable(el);fillTable();
    const F=el.getBoundingClientRect(),th=Math.acos(Math.min(1,T.height/T.width))*180/Math.PI;
    s._from="translate("+(T.left+T.width/2-(F.left+F.width/2))+"px,"+(T.top+T.height/2-(F.top+F.height/2))+"px) scale("+(T.width/F.width)+") rotateX("+th.toFixed(1)+"deg)";
    hideInCam(s,true);
    return el.animate([{transform:s._from},{transform:"none"}],{duration:D(440),easing:"cubic-bezier(.3,.7,.25,1)"}).finished;
  }
  buildBook(s);
  const book=ov.querySelector(".book"),cover=book.querySelector(".cover"),Rf=cover.getBoundingClientRect(),B=book.getBoundingClientRect(),sx=T.width/Rf.width;
  s._shift=book.classList.contains("single")?0:Rf.width/2;
  const th=Math.acos(Math.min(1,T.height/(Rf.height*sx)))*180/Math.PI;
  book.style.transformOrigin=(Rf.left-B.left+Rf.width/2)+"px "+(Rf.top-B.top+Rf.height/2)+"px";
  s._from="translate("+(T.left+T.width/2-(Rf.left+Rf.width/2))+"px,"+(T.top+T.height/2-(Rf.top+Rf.height/2))+"px) scale("+sx+") rotateX("+th.toFixed(1)+"deg)";
  s._closedT="translate("+(-s._shift)+"px,0px) scale(1) rotateX(0deg)";
  hideInCam(s,true);
  return book.animate([{transform:s._from},{transform:s._closedT}],{duration:D(440),easing:"cubic-bezier(.3,.7,.25,1)",fill:"forwards"}).finished
    .then(()=>stage===s?openBookAnim(s,book,s._closedT,"translate(0px,0px) scale(1) rotateX(0deg)"):null)
    .then(()=>{if(stage===s){book.getAnimations().forEach(a=>a.cancel());book.style.transform=""}});
}
function closeScene(){
  const s=stage;if(!s||s._closing)return;if(sheet)closeSheet(true);s._closing=true;
  s.querySelector(".stage-ctl").classList.remove("on");
  const ov=s.querySelector(".ovl"),cam=s.querySelector(".cam"),book=ov.querySelector(".book"),el=ov.querySelector(".ttop"),veil=s.querySelector(".veil");
  let p=Promise.resolve();
  if(book&&BOOKK(s._kind)){
    p=closeBookAnim(s,book,"translate("+(-s._shift)+"px,0px)","translate(0px,0px)");
    veil.animate([{opacity:.8},{opacity:0}],{duration:D(260),fill:"forwards"});
  }else if(book&&s._from){
    p=closeBookAnim(s,book,s._closedT,"translate(0px,0px) scale(1) rotateX(0deg)")
      .then(()=>book.animate([{transform:s._closedT},{transform:s._from}],{duration:D(320),easing:"cubic-bezier(.5,0,.75,.3)",fill:"forwards"}).finished);
  }else if(el&&s._from)p=el.animate([{transform:"none"},{transform:s._from}],{duration:D(330),easing:"cubic-bezier(.5,0,.75,.3)",fill:"forwards"}).finished;
  p.catch(()=>{}).then(()=>{ov.innerHTML="";hideInCam(s,false);
      veil.animate([{opacity:+getComputedStyle(veil).opacity||0},{opacity:0}],{duration:D(180),fill:"forwards"});
      s.querySelector(".stage-dim").animate([{opacity:1},{opacity:0}],{duration:D(320),fill:"forwards"});
      return animCam(cam,s._c,camHome(),D(BOOKK(s._kind)?260:300))})
    .catch(()=>{}).finally(()=>{s.remove();if(stage===s)stage=null;document.documentElement.style.overflow="";
      const h=document.querySelector('#hall [data-open="'+({table:"advs",journal:"ledger",status:"guild",archive:"archive",nora:"nora"}[s._kind])+'"]');if(h)try{h.focus({preventScroll:true})}catch(e){}});
}

        '<span class="dos-tab"></span><span class="dos-head">'+portrait(a)+'<span><b>'+esc(a.name)+'</b><i>'+esc(advCls(a).n)+'</i></span></span>'+

        '<span class="dos-area">'+esc(a.area||advCls(a).area)+'</span></button>'}).join("");

function renderAdvSheet(w,force){
  const paper=w.querySelector(".sheet");
  if(w._mode==="hire"||w._mode==="advedit"){
    if(!force)return;const hire=w._mode==="hire";
    const a=hire?{cls:Object.keys(CLASSES).find(k=>!advs.some(x=>x.cls===k))||"chron"}:advById(w._id);if(!a){closeSheet(true);return}
    const taken=new Set(advs.filter(x=>x.id!==w._id).map(x=>x.cls));
    paper.setAttribute("aria-label",hire?"Новое досье":"Правка досье");
    paper.innerHTML='<header class="sh-h"><h2>'+(hire?"Новое досье":"Правка досье")+'</h2><span class="stamp2 st-board">'+(hire?"НАЙМ":"ПРАВКА")+'</span><button class="x" data-sheet-close aria-label="Закрыть">×</button></header>'+
      '<div class="row"><label class="f">Имя<input type="text" id="h-name" maxlength="40" value="'+esc(a.name||"")+'" placeholder="Например: Мира"></label>'+
      '<label class="f">Класс<select id="h-cls">'+Object.keys(CLASSES).map(k=>'<option value="'+k+'"'+(a.cls===k?" selected":"")+(taken.has(k)?" disabled":"")+'>'+CLASSES[k].n+' · '+CLASSES[k].area+(taken.has(k)?" (уже есть)":"")+'</option>').join("")+'</select></label></div>'+
      '<label class="f">Направление работы<input type="text" id="h-area" maxlength="80" value="'+esc(a.area||"")+'" placeholder="Оставь пустым, чтобы взять направление класса"></label>'+
      '<label class="f">Характер и история<textarea id="h-bio" placeholder="Пара строк о персонаже">'+esc(a.bio||"")+'</textarea></label>'+
      '<div class="row"><button class="btn pri" id="h-save" style="flex:0 0 auto">'+(hire?"Нанять":"Сохранить")+'</button><button class="btn ghost" id="h-cancel" style="flex:0 0 auto">Отмена</button></div>';
    paper.querySelector("#h-save").onclick=()=>saveAdv(hire?null:a,id=>{if(sheet!==w)return;w._id=id;w._mode="view";if(hire)closeSheet();else renderSheet(true)});
    paper.querySelector("#h-cancel").onclick=()=>{if(hire)closeSheet();else{w._mode="view";renderSheet(true)}};
    paper.querySelector("[data-sheet-close]").onclick=()=>closeSheet();return;
  }

  const ae=document.activeElement;if(!force&&ae&&paper.contains(ae)&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){w._stale=true;return}
  const st=advStats(a),act=activeOf(a),done=st.mine.filter(q=>q.status==="done").sort((x,y)=>(y.doneAt||"").localeCompare(x.doneAt||""));
  const stat=(n,v,pct,hint)=>'<div class="stat"><small><span>'+n+'</span></small><b>'+v+'</b>'+(pct!=null?'<div class="bar"><i style="width:'+Math.min(100,pct)+'%"></i></div>':'')+'<div class="small muted">'+hint+'</div></div>';
  paper.setAttribute("aria-label","Досье: "+a.name);
  paper.innerHTML='<header class="sh-h"><span class="sh-port">'+portrait(a)+'</span><h2>'+esc(a.name)+'<span class="sh-sub">'+esc(advCls(a).n)+' · '+esc(a.area||advCls(a).area)+'</span></h2><span class="stamp2 '+(act.length?"st-active":"st-done")+'">'+(act.length?"НА ЗАДАНИИ":"СВОБОДЕН")+'</span><button class="x" data-sheet-close aria-label="Положить досье на стол">×</button></header>'+
    '<div class="state"><span class="pill gold">Ранг '+st.rank+'</span><span class="small muted">'+rankLine(st)+'</span></div>'+
    '<div class="bigbar"><i style="width:'+st.R.pct.toFixed(1)+'%"></i></div>'+(a.bio?'<p class="desc">'+esc(a.bio)+'</p>':'')+

      stat("Выносливость",st.stamina,null,"записанные шаги прогресса")+'</div>'+
    '<h3 class="sec">Сейчас</h3>'+(act.length?'<div class="qlist">'+act.map(qRow).join("")+'</div>':'<div class="empty">Свободен. Выдай ему заказ с доски.</div>')+

function paperFlight(src,F){
  if(!src)return{transform:"translateY(40px) scale(.9)",opacity:0};
  const S=src.getBoundingClientRect(),rot=parseFloat(src.getAttribute("data-rot"))||0;
  return{transform:"translate("+(S.left+S.width/2-(F.left+F.width/2))+"px,"+(S.top+S.height/2-(F.top+F.height/2))+"px) scale("+(S.width/F.width)+") rotate("+rot+"deg)",opacity:1};
}
function srcFor(w){
  if(w._kind==="nora")return document.querySelector(".stage .cam [data-noranote]");
  if(w._kind==="adv"){const t=document.querySelector(".stage .ttop");if(!t)return null;return w._mode==="hire"&&!w._id?t.querySelector("[data-hire]"):t.querySelector('[data-dossier="'+w._id+'"]')}
  const cam=document.querySelector(".stage .cam");if(!cam)return null;
  return w._mode==="new"&&!w._id?cam.querySelector("[data-newpaper]"):cam.querySelector('[data-paper="'+w._id+'"]');
}
function openSheet(id,src,mode,kind){
  kind=kind||"quest";
  if(kind==="quest"?(mode!=="new"&&!quests.find(x=>x.id===id)):kind==="adv"?(mode!=="hire"&&!advById(id)):kind!=="nora")return;
  if(sheet)closeSheet(true);
  const w=document.createElement("div");w.className="sheetwrap";
  w.innerHTML='<div class="sheetback"></div><article class="sheet" role="dialog" aria-modal="true"></article>';
  w._id=id;w._mode=mode||"view";w._kind=kind;sheet=w;document.body.appendChild(w);renderSheet(true);
  w.addEventListener("focusout",()=>setTimeout(()=>{if(sheet===w&&w._stale&&w._mode==="view")renderSheet()},0));
  const paper=w.querySelector(".sheet"),back=w.querySelector(".sheetback");back.onclick=()=>closeSheet();
  src=src||srcFor(w);
  const from=paperFlight(src,paper.getBoundingClientRect());if(src)src.style.visibility="hidden";
  back.animate([{opacity:0},{opacity:1}],{duration:D(170)});

    .then(()=>{paper.classList.remove("flying");const f=paper.querySelector(w._mode==="view"?"[data-sheet-close]":"#f-title,#h-name");f&&f.focus()});
}
function closeSheet(instant){

  if(instant){done();return}

/* ---------- checklist editor ---------- */
function renderItems(focus){
  const box=$("#f-items");if(!box)return;
  box.innerHTML=draft.map((it,i)=>'<div class="item'+(it.d?" isdone":"")+'"><span class="num" title="'+(it.d?"выполнено":"")+'">'+(it.d?"✓":i+1)+'</span>'+
    '<input type="text" id="f-item-'+i+'" data-i="'+i+'" maxlength="140" value="'+esc(it.t)+'" placeholder="Например: Глава '+(i+1)+'" aria-label="Пункт '+(i+1)+'">'+
    '<button type="button" class="ib" data-up="'+i+'" aria-label="Поднять пункт '+(i+1)+'"'+(i===0?" disabled":"")+'>↑</button>'+
    '<button type="button" class="ib" data-down="'+i+'" aria-label="Опустить пункт '+(i+1)+'"'+(i===draft.length-1?" disabled":"")+'>↓</button>'+
    '<button type="button" class="ib rm" data-rm="'+i+'" aria-label="Удалить пункт '+(i+1)+'">×</button></div>').join("")||
    '<div class="empty">Пунктов пока нет. Добавь первый.</div>';
  box.querySelectorAll("input[data-i]").forEach(inp=>{
    inp.oninput=()=>{draft[+inp.dataset.i].t=inp.value};
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();addItem(+inp.dataset.i+1)}
      else if(e.key==="Backspace"&&!inp.value&&draft.length>1){e.preventDefault();const i=+inp.dataset.i;draft.splice(i,1);renderItems(Math.max(0,i-1))}};
  });
  box.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{const i=+b.dataset.up;[draft[i-1],draft[i]]=[draft[i],draft[i-1]];renderItems(i-1)});
  box.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>{const i=+b.dataset.down;[draft[i+1],draft[i]]=[draft[i],draft[i+1]];renderItems(i+1)});
  box.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const i=+b.dataset.rm;draft.splice(i,1);renderItems(Math.min(i,draft.length-1))});
  if(focus!=null&&focus>=0){const f=$("#f-item-"+focus);if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length)}}
}
function addItem(at){draft.splice(at,0,{t:"",d:false});renderItems(at)}

/* ---------- writes ---------- */
function fail(e){const c=e&&e.code;toast(c==="invalid_argument"?"Нет прав на изменение. Попроси владельца дать доступ на редактирование.":c==="quota_exceeded"?"База переполнена: удали старые заказы.":"Не получилось сохранить. Попробуй ещё раз.");if(c==="invalid_argument"){canWrite=false;renderAll()}}
const clean=o=>JSON.parse(JSON.stringify(o));
async function saveDaily(){
  const date=$("#ddate").value||yesterday(),text=$("#dtext").value.trim();
  if(!text){toast("Опиши хотя бы один конкретный результат.");return}
  const btn=$("#dsave");btn.disabled=true;
  try{await db.doc("daily/"+date).set({date,text,by:me?.id||null,at:new Date().toISOString()});toast("Запись за "+ru(date)+" внесена в журнал. +"+DAILY_XP+" XP");if(modalState?.kind==="ledger"){modalState.arg=date;renderModal()}}
  catch(e){fail(e)}finally{const b=$("#dsave");if(b)b.disabled=false}
}
function checkFile(f){
  const ext=extOf(f.name);
  if(!ATT_TYPES[ext])return "Формат ."+ext+" не поддерживается: сохрани файл в PDF и прикрепи снова.";
  const max=ext==="svg"?2:20;if(f.size>max*1048576)return "Файл «"+f.name+"» больше "+max+" МБ.";
  if(!f.size)return "Файл «"+f.name+"» пустой.";
  return "";
}
function attErr(e,name){const c=e&&e.code;
  return c==="too_large"?"Файл «"+name+"» слишком большой.":c==="unsupported_type"?"Формат «"+name+"» не поддерживается.":c==="quota_or_state"?"Хранилище гильдии заполнено: открепи старые документы.":
    c==="rate_limited"?"Слишком много загрузок подряд. Подожди немного.":c==="not_granted"?"Прикреплять файлы могут только редакторы гильдии.":"Не удалось загрузить «"+name+"». Попробуй ещё раз."}
function refreshQuestViews(){renderSheet(true);renderAeExtra();if(modalState&&modalState.kind==="quest")renderModal()}
async function uploadFiles(qid,files){
  if(!assetsApi){toast("Прикреплять файлы могут только редакторы гильдии.");return}
  for(const f of files){
    const bad=checkFile(f);if(bad){toast(bad);continue}
    (uploading[qid]=uploading[qid]||[]).push(f.name);refreshQuestViews();
    try{
      const r=await assetsApi.upload(f,{type:ATT_TYPES[extOf(f.name)]});
      const cur=quests.find(x=>x.id===qid);
      if(!cur){assetsApi.delete(r.id).catch(()=>{});continue}
      const list=(cur.attachments||[]).concat({id:r.id,name:f.name,size:r.sizeBytes,type:r.contentType,at:new Date().toISOString(),by:me?.id||null});
      await db.doc("quests/"+qid).update({attachments:list,updatedAt:new Date().toISOString()});
      toast("Документ прикреплён: «"+f.name+"».");
    }catch(e){toast(e&&e.code&&!/^(invalid_argument|quota_exceeded|unavailable|revoked)$/.test(e.code)?attErr(e,f.name):"Не удалось прикрепить «"+f.name+"».")}
    finally{const u=uploading[qid]||[];const i=u.indexOf(f.name);if(i>=0)u.splice(i,1);refreshQuestViews()}
  }
}
async function removeAttachment(qid,f){
  const cur=quests.find(x=>x.id===qid);if(!cur)return;
  try{await db.doc("quests/"+qid).update({attachments:(cur.attachments||[]).filter(x=>x.id!==f.id),updatedAt:new Date().toISOString()});
    if(assetsApi)assetsApi.delete(f.id).catch(()=>{});toast("Документ «"+f.name+"» откреплён.")}
  catch(e){fail(e)}
}
async function confirmCheck(addReport){
  const pc=pendingCheck;if(!pc)return;pendingCheck=null;
  const cur=quests.find(x=>x.id===pc.qid);if(!cur){refreshQuestViews();return}
  const mn=(parseInt(pc.h,10)||0)*60+(parseInt(pc.m,10)||0),dd=pc.d||today(),jd=pc.jd||dd;
  if(pc.type==="count"){
    const total=(+cur.current||0)+pc.n,h=pushHist(cur,"+"+pc.n,pc.note);const last=h[h.length-1];last.day=dd;if(mn)last.min=mn;
    refreshQuestViews();
    await patch(cur,{current:total,history:h},"Прогресс записан: "+total+" / "+cur.target+" "+(cur.unit||"")+".");
    if(addReport){const en={t:"quest",qid:cur.id,i:"c"+Date.now(),title:cur.title,cnt:pc.n,unit:cur.unit||"",note:pc.note||""};if(mn)en.min=mn;await appendDaily(jd,en)}
    return;
  }
  if(pc.type==="submit"){
    const at=dd===today()?new Date().toISOString():dd+"T12:00:00.000Z",data={status:"review",submittedAt:at,result:pc.res||cur.result||"",note:""};if(mn)data.doneMin=mn;
    refreshQuestViews();
    await patch(cur,data,"Заказ сдан и ушёл в архив. Опыт начислится после подтверждения.");
    if(sheet&&sheet._id===cur.id)closeSheet(true);
    if(addReport){const en={t:"quest",qid:cur.id,i:null,title:cur.title,done:true};if(mn)en.min=mn;await appendDaily(jd,en)}
    return;
  }
  const items=clean(cur.items||[]),it=items[pc.i];if(!it){refreshQuestViews();return}
  const min=(parseInt(pc.h,10)||0)*60+(parseInt(pc.m,10)||0);
  it.d=true;it.at=pc.d||today();if(min>0)it.min=min;else delete it.min;
  refreshQuestViews();
  await patch(cur,{items,history:pushHist(cur,"✓",it.t)},"Пункт выполнен: «"+it.t+"». +"+STEP_XP+" XP после подтверждения заказа");
  if(addReport){const en={t:"quest",qid:cur.id,i:pc.i,title:cur.title,item:it.t};if(min)en.min=min;await appendDaily(jd,en)}
}
async function uncheckItem(q,i){const items=clean(q.items||[]);if(!items[i])return;items[i].d=false;delete items[i].at;delete items[i].min;await patch(q,{items},null)}
async function appendDaily(date,line){
  const l=entriesOf(daily.find(d=>d.id===date)).filter(x=>!(x.t==="quest"&&x.qid===line.qid&&x.i===line.i));l.push(line);
  try{await saveEntries(date,l);toast("Добавлено в журнал за "+ru(date)+".")}catch(err){fail(err)}
}
async function saveQuest(old,after){
  const title=$("#f-title").value.trim();if(!title){toast("Дай заказу название.");return}
  const kind=$("#f-kind").value;
  const q=old?clean(old):{id:uid(),status:"board",createdAt:new Date().toISOString(),createdBy:me?.id||null,history:[],current:0,adv:null};
  Object.assign(q,{title,desc:$("#f-desc").value.trim(),rank:$("#f-rank").value,deadline:$("#f-dl").value||"",kind});
  const fc=$("#f-created"),ft=$("#f-taken"),isoD=(v,prev)=>prev&&prev.slice(0,10)===v?prev:v+"T12:00:00.000Z";
  if(fc&&fc.value){if(fc.value>today()){toast("Дата создания не может быть в будущем.");return}q.createdAt=isoD(fc.value,q.createdAt)}
  if(ft&&ft.value){if(ft.value>today()){toast("Дата начала не может быть в будущем.");return}if(fc&&fc.value&&ft.value<fc.value){toast("Заказ не может начаться раньше, чем создан.");return}q.takenAt=isoD(ft.value,q.takenAt)}
  if(kind==="counter"){const t=parseInt($("#f-target").value,10);if(!(t>0)){toast("Укажи цель числом, например 300.");return}q.target=t;q.unit=$("#f-unit").value.trim();q.current=q.current||0}
  if(kind==="checklist"){
    const items=draft.map(i=>({t:i.t.trim(),d:!!i.d})).filter(i=>i.t);
    if(!items.length){toast("Добавь хотя бы один пункт чек-листа.");return}
    q.items=items;
  }
  q.updatedAt=new Date().toISOString();const id=q.id;delete q.id;
  $("#f-save").disabled=true;
  const files=old?[]:pendingFiles.splice(0);
  try{await db.doc("quests/"+id).set(q);toast(old?"Заказ обновлён.":"Новый заказ на доске: «"+title+"».");if(files.length)uploadFiles(id,files);if(after)after(id);else openModal("quest",id)}
  catch(e){fail(e);const b=$("#f-save");if(b)b.disabled=false}
}
async function saveAdv(old,after){
  const name=$("#h-name").value.trim();if(!name){toast("Дай авантюристу имя.");return}
  const cls=$("#h-cls").value;
  const data={name,cls,area:$("#h-area").value.trim(),bio:$("#h-bio").value.trim(),color:CLASSES[cls].c};
  const id=old?old.id:uid();if(!old)data.createdAt=new Date().toISOString();
  $("#h-save").disabled=true;
  try{if(old)await db.doc("adventurers/"+id).update(data);else await db.doc("adventurers/"+id).set(data);toast(old?"Данные обновлены.":name+" вступает в гильдию.");if(after)after(id);else openModal("adv",id)}
  catch(e){fail(e);const b=$("#h-save");if(b)b.disabled=false}
}
async function cancelQuest(q0){
  const q=quests.find(x=>x.id===q0.id)||q0;pendingCheck=null;
  const data={status:"board",adv:null,takenAt:null,submittedAt:null,doneAt:null,doneMin:null,current:0,history:[],result:"",note:""};
  if(q.kind==="checklist")data.items=clean(q.items||[]).map(i=>({t:i.t,d:false}));
  try{
    await db.doc("quests/"+q.id).update(Object.assign({updatedAt:new Date().toISOString()},data));
    let n=0;
    for(const d of daily){const ents=entriesOf(d);if(!ents.some(x=>x.t==="quest"&&x.qid===q.id))continue;
      const left=ents.filter(x=>!(x.t==="quest"&&x.qid===q.id));n++;await saveEntries(d.id,left)}
    toast("Заказ «"+q.title+"» возвращён в «Новые», прогресс сброшен."+(n?" Записи в журнале убраны ("+n+" "+(n===1?"день":n<5?"дня":"дней")+").":""));
  }catch(e){fail(e)}
}
async function patch(q,data,msg){try{await db.doc("quests/"+q.id).update(Object.assign({updatedAt:new Date().toISOString()},data));if(msg)toast(msg)}catch(e){fail(e)}}
function pushHist(q,delta,note){const h=(q.history||[]).slice(-199);h.push({at:new Date().toISOString(),by:me?.id||null,delta:String(delta),note:note||""});return h}
async function addCount(q){
  const n=parseInt($("#c-delta").value,10);if(!(n>0)){toast("Введи, сколько сделано, числом.");return}
  pendingCheck={type:"count",qid:q.id,n,note:$("#c-note").value.trim(),unit:q.unit||"",step:"form",h:"0",m:"0",d:today()};refreshQuestViews();
}
async function toggleItem(q,i,val){
  const items=clean(q.items||[]);items[i].d=val;
  const data={items};if(val)data.history=pushHist(q,"✓",items[i].t);
  await patch(q,data,val?"Подзадача выполнена: «"+items[i].t+"». +"+STEP_XP+" XP":null);
}
async function questAct(q,a){
  const now=new Date().toISOString(),pick=$("#a-pick")?.value||null,pa=advById(pick);
  if((a==="take"||a==="reassign")&&pick==="rat"){if(a==="reassign"&&isRat(q))return;const nm=pickRatName(q);
    return patch(q,a==="take"?{status:"active",adv:"rat",rat:nm,takenAt:now}:{adv:"rat",rat:nm},"Заказ отдан крысам. За дело берётся крыса "+nm+".")}
  if(a==="take"){if(!pa){toast("Выбери авантюриста.");return}if(activeOf(pa).filter(z=>z.id!==q.id).length>=MAX_ACTIVE){toast(pa.name+" уже на задании. Каждый авантюрист берёт только один заказ за раз.");return}return patch(q,{status:"active",adv:pick,takenAt:now},pa.name+" отправляется выполнять заказ.")}
  if(a==="reassign"){if(!pa||pick===q.adv)return;if(activeOf(pa).filter(z=>z.id!==q.id).length>=MAX_ACTIVE){toast(pa.name+" уже на задании.");return}return patch(q,{adv:pick},"Заказ передан: "+pa.name+".")}
  if(a==="submit"){if(q.kind!=="simple"&&progressOf(q)<1){toast(q.kind==="checklist"?"Сначала выполни все пункты.":"Сначала запиши весь прогресс.");return}}
  if(a==="submit"){const tm=q.kind==="checklist"?(q.items||[]).reduce((t,i)=>t+(i.d&&+i.min||0),0):q.kind==="counter"?(q.history||[]).reduce((t,h)=>t+(+h.min||0),0):0;
    pendingCheck={type:"submit",qid:q.id,res:($("#r-res")?.value||"").trim(),step:"form",h:String(Math.floor(tm/60)),m:String(tm%60),d:today()};refreshQuestViews();return}
  if(a==="accept"){pendingCheck={type:"accept",qid:q.id,step:"form",h:"0",m:"0",d:today()};refreshQuestViews();return}
  if(a==="return")return patch(q,{status:"active",note:($("#r-note")?.value||"").trim()},"Заказ возвращён на доработку.");
  if(a==="unassign")return patch(q,{status:"board",adv:null},"Заказ снова висит на доске.");
  if(a==="reopen")return patch(q,{status:"active",doneAt:null},"Заказ снова в работе.");
  if(a==="edit"){if(sheet&&sheet._id===q.id){sheet._mode="edit";renderSheet(true);return}return openModal("edit",q.id)}
  if(a==="cancel"){const a2=qAdv(q);$("#delbox").innerHTML='<div class="confirm">Вернуть заказ на доску? Он вернётся в «Новые», весь прогресс обнулится, записи о нём исчезнут из журнала'+(a2?', а '+esc(a2.name)+' станет свободен':'')+'. <button class="btn ret sm" id="cn-yes">Вернуть</button><button class="btn ghost sm" id="cn-no">Не возвращать</button></div>';
    $("#cn-no").onclick=()=>$("#delbox").innerHTML="";
    $("#cn-yes").onclick=()=>cancelQuest(q);return}
  if(a==="del"){$("#delbox").innerHTML='<div class="confirm">Удалить заказ навсегда? <button class="btn warn sm" id="del-yes">Удалить</button><button class="btn ghost sm" id="del-no">Отмена</button></div>';
    $("#del-no").onclick=()=>$("#delbox").innerHTML="";
    $("#del-yes").onclick=async()=>{try{await db.doc("quests/"+q.id).delete();if(assetsApi)(q.attachments||[]).forEach(f=>assetsApi.delete(f.id).catch(()=>{}));toast("Заказ удалён.");if(sheet&&sheet._id===q.id)closeSheet(true);else closeModal()}catch(e){fail(e)}}}
}

const FORMS=new Set(["new","edit","hire","ledger"]);
function renderAll(){renderHUD();renderActive();drawHall();if(!(modalState&&FORMS.has(modalState.kind)))renderModal();renderBoardPanel();fillTable();refreshBook();renderSheet();
  document.querySelectorAll('.wrap [data-open="new"]').forEach(b=>b.hidden=!canWrite);}

/* ---------- wiring ---------- */
document.addEventListener("click",e=>{
  const o=e.target.closest(".wrap [data-open]");if(o){openModal(o.dataset.open);return}
  const q=e.target.closest(".wrap [data-q]");if(q)openModal("quest",q.dataset.q);
});
function ringBell(){
  const L=$("#bellLayer");if(!L)return;
  const old=[...L.children],before=old.map(b=>b.getBoundingClientRect().top);
  const b=document.createElement("div");b.className="bub";b.textContent="Дзынь!";L.appendChild(b);
  old.forEach((o,i)=>{const d=before[i]-o.getBoundingClientRect().top;if(d)o.animate([{translate:"0 "+d+"px"},{translate:"0 0"}],{duration:180,easing:"ease-out"})});
  setTimeout(()=>{b.classList.add("fade");setTimeout(()=>b.remove(),1000)},3000);
  const g=$("#hall .bell");if(g){g.classList.remove("ring");void g.getBoundingClientRect();g.classList.add("ring")}
}
$("#hall").addEventListener("click",e=>{if(e.target.closest&&e.target.closest("[data-bell]"))ringBell()});
$("#hall").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.closest&&e.target.closest("[data-bell]")){e.preventDefault();ringBell();return}const t=e.target.closest&&e.target.closest("[data-open]");if((e.key==="Enter"||e.key===" ")&&t){e.preventDefault();openModal(t.dataset.open)}});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!$("#modal").hidden)closeModal();else if(sheet)closeSheet();else if(stage)closeBoard()});

renderAll();
$("#activeList").innerHTML='<div class="empty">Открываю гильдию...</div>';

let qIn=false,dIn=false;
(async function boot(){
  if(!window.claude||!window.claude.use){$("#status").hidden=false;$("#status").textContent="Гильдия открыта вне Claude: заказы не загружаются. Открой ссылку на артефакт.";return}
  [db,user,assetsApi]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("assets").catch(()=>null)]);
  if(!db){$("#status").hidden=false;$("#status").textContent="База гильдии недоступна. Войди в аккаунт Claude, чтобы видеть и создавать заказы.";$("#activeList").innerHTML='<div class="empty">Заказы недоступны.</div>';return}
  if(user){me=await user.me();isOwner=me.isOwner;const c=await user.can("data.write");canWrite=c!==false;}
  if(!canWrite){$("#status").hidden=false;$("#status").textContent="Режим просмотра: у тебя нет прав создавать и менять заказы.";}
  db.doc("meta/hunter").onSnapshot(s=>{ownerId=s.exists?s.data().ownerId:null;
    if(isOwner&&me?.id&&ownerId!==me.id&&canWrite){db.doc("meta/hunter").set({ownerId:me.id}).catch(()=>{})}
    renderName()},()=>{});
  db.collection("quests").onSnapshot(s=>{quests=s.docs.map(d=>Object.assign({id:d.id},d.data()));qIn=true;renderAll();
      if(!loaded&&dIn){loaded=true;prevLevel=guildLevel(guildXP()).level}},
    ()=>{$("#status").hidden=false;$("#status").textContent="Связь с базой гильдии потеряна. Обнови страницу."});
  db.collection("adventurers").onSnapshot(s=>{advs=s.docs.map(d=>Object.assign({id:d.id},d.data()));renderAll()},()=>{});
  db.collection("daily").orderBy("date","desc").limit(365).onSnapshot(s=>{daily=s.docs.map(d=>Object.assign({id:d.id},d.data()));dIn=true;renderAll();
      if(!loaded&&qIn){loaded=true;prevLevel=guildLevel(guildXP()).level}},()=>{});
  renderName();
})();
})();
</script>
